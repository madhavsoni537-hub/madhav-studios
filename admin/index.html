<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madhav Studios — Owner Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: min(420px, 90%);
      padding: 42px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
    }

    .logo {
      font-size: 13px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #bbb;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      background: #080808;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #fff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      color: #ff7777;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      margin-top: 25px;
      color: #888;
      text-decoration: none;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="login-box">
    <div class="logo">MADHAV STUDIOS</div>

    <h1>Owner Login</h1>

    <p class="subtitle">
      Sign in to manage your studio.
    </p>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In
      </button>

      <div id="message"></div>
    </form>

    <a class="back" href="../index.html">
      ← Back to website
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Signing in...";
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Sign In";
        return;
      }

      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
