<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madhav Studios — Messages</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

.topbar{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  border-bottom:1px solid #222;
}

.logo{
  letter-spacing:4px;
  font-size:14px;
}

.logout{
  background:#fff;
  color:#000;
  border:0;
  padding:10px 18px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  width:min(1100px,92%);
  margin:40px auto;
}

h1{
  font-size:36px;
  margin-bottom:8px;
}

.subtitle{
  color:#888;
  margin-bottom:30px;
}

.message{
  background:#111;
  border:1px solid #292929;
  border-radius:14px;
  padding:22px;
  margin-bottom:15px;
}

.message-top{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-bottom:15px;
}

.name{
  font-size:18px;
  font-weight:bold;
}

.email{
  color:#999;
  font-size:14px;
  margin-top:5px;
}

.date{
  color:#777;
  font-size:12px;
}

.subject{
  font-size:16px;
  font-weight:bold;
  margin-bottom:10px;
}

.text{
  color:#bbb;
  line-height:1.6;
  white-space:pre-wrap;
}

.empty{
  color:#777;
  padding:40px;
  text-align:center;
  border:1px dashed #333;
  border-radius:14px;
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">MADHAV STUDIOS</div>
  <button class="logout" id="logoutButton">Logout</button>
</header>

<main class="container">

  <h1>Messages</h1>
  <p class="subtitle">
    Contact messages received from your website.
  </p>

  <div id="messagesList">
    Loading messages...
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>

<script>

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

async function checkOwner(){

  const {
    data:{session}
  } = await supabaseClient.auth.getSession();

  if(!session){
    window.location.href="index.html";
    return false;
  }

  const {data,error} =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id",session.user.id)
      .maybeSingle();

  if(error || !data){
    await supabaseClient.auth.signOut();
    window.location.href="index.html";
    return false;
  }

  return true;
}


async function loadMessages(){

  const list =
    document.getElementById("messagesList");

  const {data,error} =
    await supabaseClient
      .from("contact_submissions")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){
    list.innerHTML =
      `<div class="empty">
        Error loading messages:<br><br>
        ${error.message}
      </div>`;
    return;
  }

  if(!data || data.length === 0){
    list.innerHTML =
      `<div class="empty">
        No messages yet.
      </div>`;
    return;
  }

  list.innerHTML = data.map(message => {

    const date = message.created_at
      ? new Date(message.created_at).toLocaleString()
      : "";

    return `
      <div class="message">

        <div class="message-top">

          <div>
            <div class="name">
              ${escapeHTML(message.name || "Unknown")}
            </div>

            <div class="email">
              ${escapeHTML(message.email || "")}
            </div>
          </div>

          <div class="date">
            ${escapeHTML(date)}
          </div>

        </div>

        <div class="subject">
          ${escapeHTML(message.subject || "Contact Form")}
        </div>

        <div class="text">
          ${escapeHTML(message.message || "")}
        </div>

      </div>
    `;

  }).join("");
}


function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


document
  .getElementById("logoutButton")
  .addEventListener("click",async()=>{

    await supabaseClient.auth.signOut();

    window.location.href="index.html";

  });


(async()=>{

  const owner = await checkOwner();

  if(owner){
    await loadMessages();
  }

})();

</script>

</body>
</html>
